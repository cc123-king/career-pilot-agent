name: Tests

on: [push, pull_request]

permissions:

  contents: read

jobs:

  offline:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    env:

      HF_HUB_OFFLINE: "1"

      TRANSFORMERS_OFFLINE: "1"

      MPLBACKEND: Agg

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7

        with:

          python-version: "3.12"

          cache: pip

      - run: python -m pip install -e ".[dev]"

      - run: python -m pytest -q -p no:cacheprovider

