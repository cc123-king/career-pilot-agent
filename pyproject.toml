[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-pilot-agent"
version = "0.1.0"
description = "基于 LangGraph 的多智能体求职助手"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dcc" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "gradio>=6.0,<7.0",
  "langgraph>=0.2,<2.0",
  "openai>=1.60,<3.0",
  "pydantic>=2.9,<3.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]
