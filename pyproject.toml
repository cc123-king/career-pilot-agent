[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "career-pilot-agent"
version = "0.1.0"
description = "A multi-agent career assistant for resume and job analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "gradio>=5.0,<6.0",
    "langgraph>=0.2,<2.0",
    "onnxruntime>=1.20,<2.0",
    "openai>=1.60,<3.0",
    "Pillow>=11.0,<13.0",
    "pydantic>=2.10,<3.0",
    "PyMuPDF>=1.25,<2.0",
    "python-docx>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "rapidocr>=3.4,<4.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp -p no:cacheprovider"

[tool.ruff]
line-length = 88
target-version = "py312"
